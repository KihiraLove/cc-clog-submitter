<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="description" content="RuneLite collection log submission API test frontend">
<title>Collection Log · Submission Tester</title>
<link rel="stylesheet" href="./styles.css"></head>
<body><main class="page-shell">
<header class="hero"><h1>Collection Log <span>Submission Tester</span></h1></header>
<form id="submission-form" class="panel" autocomplete="off">
<div class="section-heading"><h2>Connection</h2></div>
<div class="fields">
<label class="field" for="endpoint">Endpoint<input id="endpoint" type="url" required placeholder="https://clog.example.com" spellcheck="false"></label>
<label class="field" for="api-key">Clan API key <span class="password-wrap"><input id="api-key" type="password" placeholder="Clan shared key" spellcheck="false" autocomplete="off"><button type="button" id="toggle-key" class="secondary">Show</button></span></label>
</div>
<div class="section-heading separated"><h2>Submission</h2></div>
<div class="fields">
<label class="field" for="username">Username<input id="username" required maxlength="80" placeholder="Collector"></label>
<label class="field" for="clan-name">Clan name<input id="clan-name" required maxlength="80" placeholder="Vardorvis"></label>
<label class="field full" for="item-search">Search items
<input id="item-search" type="search" placeholder="Search name or OSRS game item ID..." aria-controls="item-results"></label>
<div class="item-picker" aria-label="Item selection">
<p id="selected-item" class="selected-item" role="status" aria-live="polite">No item selected</p>
<div id="item-results" class="item-results" role="group" aria-label="Items matching search" aria-busy="true">
<p class="item-message">Loading catalogue…</p>
</div>
</div>
<fieldset class="world-flags"><legend>Worlds flags</legend><div class="world-controls">
<div class="segmented" role="group" aria-label="World membership">
<label><input type="radio" name="membership" value="MEMBERS" checked><span>MEMBERS</span></label>
<label><input type="radio" name="membership" value="F2P"><span>F2P</span></label></div>
<select id="world-type" aria-label="Additional world flag">
<option value="">None</option>
<option>PVP</option><option>HARDCORE_MAIN</option><option>BOUNTY</option>
<option>HIGH_RISK</option><option>BETA_WORLD</option><option>DEADMAN</option>
<option>FRESH_START_WORLD</option><option>LAST_MAN_STANDING</option>
<option>NOSAVE_MODE</option><option>PVP_ARENA</option><option>QUEST_SPEEDRUNNING</option>
<option>SEASONAL</option><option>SKILL_TOTAL</option><option>TOURNAMENT_WORLD</option>
</select></div></fieldset></div>
<p id="world-note" class="inline-note" aria-live="polite"></p>
<label class="idempotency-option" for="keep-idempotency-key">
<input id="keep-idempotency-key" type="checkbox">
<span>Don't regenerate idempotency key (only check this if you know what you're doing)</span>
</label>
<div class="controls"><button type="submit" id="submit" class="primary">Send submission</button><button type="button" id="clear-settings" class="secondary">Clear saved settings</button></div>
<div id="notice" class="notice" hidden role="status" aria-live="polite"></div>
</form>
<section id="response-section" class="panel response-panel" hidden><h2>API response</h2><p id="response-description"></p><pre id="response-body" tabindex="0"></pre></section>
</main><script type="module" src="./src/app.js"></script></body></html>
